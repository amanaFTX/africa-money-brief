name: Import AMB infographic
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "HTTPS URL of the generated image (must be fetchable by GitHub Actions)"
        required: true
        type: string
      filename:
        description: "Filename, e.g. amb-fx-2026-10-08.jpg"
        required: true
        type: string
      sha256:
        description: "Expected SHA-256 of image bytes"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: amb-image-import-main
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import and verify image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          IMAGE_FILENAME: ${{ inputs.filename }}
          IMAGE_SHA256: ${{ inputs.sha256 }}
        run: |
          python scripts/import_brief_image.py --url "$IMAGE_URL" --name "$IMAGE_FILENAME" --sha256 "$IMAGE_SHA256"
      - name: Commit image to website
        env:
          IMAGE_FILENAME: ${{ inputs.filename }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "assets/briefs/$IMAGE_FILENAME"
          git commit -m "Publish AMB infographic $IMAGE_FILENAME"
          git push origin HEAD:main
