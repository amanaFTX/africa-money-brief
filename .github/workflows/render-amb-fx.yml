name: Render AMB FX infographic
on:
  push:
    branches: [main]
    paths:
      - 'briefs/amb-fx-*.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amb-fx-render-main
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install Pillow==11.3.0
      - name: Render latest FX briefing
        run: |
          set -euo pipefail
          FILE=$(find briefs -maxdepth 1 -name 'amb-fx-*.json' | sort | tail -n 1)
          test -n "$FILE"
          python scripts/render_fx_brief.py "$FILE"
      - name: Commit generated infographic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/briefs/
          if ! git diff --cached --quiet; then
            git commit -m "Render latest AMB FX infographic"
            git push origin HEAD:main
          fi
